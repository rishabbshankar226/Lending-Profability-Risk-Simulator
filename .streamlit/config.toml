[theme]
base = "light"
primaryColor = "#145b72"
backgroundColor = "#f5f7fa"
secondaryBackgroundColor = "#edf2f6"
textColor = "#182c3e"
yellowTextColor = "#805016"
font = "sans serif"
baseFontSize = 16
metricValueFontSize = "2rem"
metricValueFontWeight = 600
headingFontSizes = ["1.875rem", "1.375rem", "1.125rem", "1rem", "1rem", "1rem"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
baseRadius = "0.5rem"
buttonRadius = "0.375rem"
borderColor = "#dce4eb"
dataframeHeaderBackgroundColor = "#edf2f6"
showWidgetBorder = true
showSidebarBorder = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[server]
headless = true
