name: Financial and dashboard checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest
      - run: python -m compileall -q app.py lending_simulator
      - run: python -m lending_simulator.cli --output artifacts/base-case
      - uses: actions/upload-artifact@v7
        with:
          name: base-case-financial-exports
          path: artifacts/base-case/
